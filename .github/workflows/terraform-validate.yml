name: terraform-validate

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/terraform-validate.yml"
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/terraform-validate.yml"

permissions:
  contents: read

concurrency:
  group: terraform-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dev:
    name: Validate environments/dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@<SHA> # vX.Y.Z

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@<SHA> # vX.Y.Z
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize (no backend)
        run: terraform -chdir=environments/dev init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=environments/dev validate
