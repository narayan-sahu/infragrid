name: terraform-validate

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/terraform-validate.yml"
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/terraform-validate.yml"

permissions:
  contents: read

concurrency:
  group: terraform-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover environments
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      environments: ${{ steps.list.outputs.environments }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List environment directories
        id: list
        run: |
          list=$(find environments -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -sc .)
          echo "Environments: ${list}"
          [ "${list}" != "[]" ]
          echo "environments=${list}" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate environments/${{ matrix.environment }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.discover.outputs.environments) }}
    env:
      ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check environment name matches directory
        run: |
          grep -qE '^[[:space:]]*environment[[:space:]]*=[[:space:]]*"'"${ENVIRONMENT}"'"[[:space:]]*$' "environments/${ENVIRONMENT}/main.tf"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize (no backend)
        run: terraform -chdir="environments/${ENVIRONMENT}" init -backend=false -input=false

      - name: Validate
        run: terraform -chdir="environments/${ENVIRONMENT}" validate

      - name: Run root tests
        run: terraform -chdir="environments/${ENVIRONMENT}" test
