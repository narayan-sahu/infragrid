name: tflint

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - ".tflint.hcl"
      - ".github/workflows/tflint.yml"
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - ".tflint.hcl"
      - ".github/workflows/tflint.yml"

permissions:
  contents: read

concurrency:
  group: tflint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tflint:
    name: Lint Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: Install plugins
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact
