name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Formatting is checked by the terraform-validate workflow.
      SKIP: terraform-fmt
    steps:
      - name: Check out repository
        uses: actions/checkout@<SHA> # vX.Y.Z

      - name: Set up Python
        uses: actions/setup-python@<SHA> # vX.Y.Z
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run hooks on all files
        run: pre-commit run --all-files --show-diff-on-failure
